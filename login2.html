<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Modern login page design">
<title>Sign In — Nova</title>
<style>
:root{--bg:#070b16;--card:rgba(14,20,36,.78);--text:#f7f8fc;--muted:#8f99ad;--line:rgba(255,255,255,.1);--accent:#7c6cff;--accent2:#2bd5ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 12%,rgba(124,108,255,.2),transparent 30%),radial-gradient(circle at 88% 88%,rgba(43,213,255,.16),transparent 28%),var(--bg)}
body:before{content:"";position:fixed;inset:-30%;z-index:-1;background:conic-gradient(from 180deg at 50% 50%,transparent,rgba(124,108,255,.08),transparent,rgba(43,213,255,.06),transparent);animation:drift 16s linear infinite}
@keyframes drift{to{transform:rotate(360deg)}}
.shell{width:min(100%,1050px);display:grid;grid-template-columns:1.05fr .95fr;min-height:610px;overflow:hidden;border:1px solid var(--line);border-radius:30px;background:var(--card);box-shadow:0 35px 100px rgba(0,0,0,.45);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.intro{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:52px;background:linear-gradient(145deg,rgba(124,108,255,.16),rgba(43,213,255,.04) 65%,transparent)}
.intro:after{content:"";position:absolute;width:260px;height:260px;right:-110px;bottom:-120px;border-radius:50%;background:rgba(43,213,255,.12);filter:blur(50px)}
.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;font-size:21px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 32px rgba(91,105,255,.3)}
.intro-content{max-width:440px}.eyebrow{margin:0 0 14px;color:#aeb7ff;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.intro h2{margin:0;font-size:clamp(38px,5vw,58px);line-height:1.02;letter-spacing:-2.5px}.intro p{margin:22px 0 0;max-width:390px;color:var(--muted);line-height:1.7;font-size:15px}
.status{display:inline-flex;align-items:center;gap:9px;width:fit-content;padding:9px 13px;border:1px solid var(--line);border-radius:999px;color:#aeb7ca;background:rgba(255,255,255,.035);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#5ee7a4;box-shadow:0 0 12px rgba(94,231,164,.7)}
.form-panel{display:flex;align-items:center;padding:52px;border-left:1px solid var(--line);background:rgba(5,9,20,.3)}.form-wrap{width:100%;max-width:390px;margin:auto}.form-wrap h1{margin:0 0 8px;font-size:30px;letter-spacing:-.8px}.subtitle{margin:0 0 30px;color:var(--muted);font-size:14px}
label{display:block;margin:0 0 8px;color:#d5d9e6;font-size:13px;font-weight:650}input{width:100%;height:50px;margin-bottom:19px;padding:0 15px;outline:none;border:1px solid var(--line);border-radius:13px;color:var(--text);background:rgba(255,255,255,.045);font:inherit;transition:.2s ease}input::placeholder{color:#687286}input:focus{border-color:rgba(124,108,255,.9);background:rgba(124,108,255,.06);box-shadow:0 0 0 4px rgba(124,108,255,.11)}
.options{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 23px;font-size:12px}.remember{display:flex;align-items:center;gap:8px;margin:0;color:#9099ab;font-weight:500}.remember input{width:15px;height:15px;margin:0;accent-color:var(--accent)}a{color:#a4aaff;text-decoration:none}a:hover{text-decoration:underline}
button{width:100%;height:50px;border:0;border-radius:13px;color:#fff;background:linear-gradient(135deg,#7568ff,#21bde9);font:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 14px 30px rgba(64,103,255,.23);transition:transform .2s ease,box-shadow .2s ease}button:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(64,103,255,.34)}
.divider{display:flex;align-items:center;gap:13px;margin:25px 0;color:#596276;font-size:11px;text-transform:uppercase;letter-spacing:1px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}
.demo-button{background:rgba(255,255,255,.045);border:1px solid var(--line);box-shadow:none;color:#cbd2df}.demo-button:hover{background:rgba(255,255,255,.07);box-shadow:none}.signup{margin:25px 0 0;color:#747e92;text-align:center;font-size:12px}
@media(max-width:760px){body{overflow:auto;padding:14px}.shell{grid-template-columns:1fr;min-height:auto;border-radius:24px}.intro{min-height:330px;padding:34px}.intro h2{font-size:40px}.form-panel{padding:34px;border-left:0;border-top:1px solid var(--line)}}@media(max-width:430px){.intro,.form-panel{padding:28px 22px}}
</style>
</head>
<body>
<main class="shell">
<section class="intro">
<div class="logo" aria-label="Nova">N</div>
<div class="intro-content"><p class="eyebrow">Welcome back</p><h2>Everything you need, in one place.</h2><p>A clean, focused space designed to help you get where you're going without distractions.</p></div>
<div class="status"><span class="dot"></span>Secure &amp; beautifully simple</div>
</section>
<section class="form-panel">
<div class="form-wrap">
<h1>Sign in</h1><p class="subtitle">Enter your details to continue.</p>
<form>
<label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email">
<label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
<div class="options"><label class="remember"><input type="checkbox">Remember me</label><a href="#">Forgot password?</a></div>
<button type="button">Sign in</button>
</form>
<div class="divider">or</div>
<button class="demo-button" type="button">Continue with demo</button>
<p class="signup">New here? <a href="#">Create an account</a></p>
</div>
</section>
</main>
</body>
</html>
